  /v2/notes/{note_id}/related-notes:
    get:
      description: 'Find notes semantically related to the current persisted content of a note.

        The source note is embedded at request time, so newly created or recently

        updated notes can be used before asynchronous indexing catches up.

        Candidate related notes still come from the note search index.'
      operationId: app_src_api_routes_external_v2_notes_views_find_related_notes
      parameters:
      - description: 'Maximum number of related notes to return.

          Default is 10; valid range is 1 to 20.'
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: 'Maximum number of related notes to return.

            Default is 10; valid range is 1 to 20.'
          maximum: 20
          minimum: 1
          title: Limit
          type: integer
      - description: UUID of the source note. The caller must be able to access this note.
        in: path
        name: note_id
        required: true
        schema:
          description: UUID of the source note. The caller must be able to access this note.
          format: uuid
          title: Note Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindRelatedNotesResponseSchema'
          description: OK
      summary: Find Related Notes
      tags:
