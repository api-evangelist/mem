  /v2/notes/search:
    post:
      description: 'Search notes using a required free-text query and structured filters.

        When multiple `filter_by_contains_*` fields are true, a note may match any of them.

        Returns note results from a bounded search snapshot with deterministic offset pagination.

        Query-based searches are relevance-ranked within the bounded search snapshot window.

        Reuse the returned `snapshot_id` when requesting later pages.

        The returned `total` reflects the bounded search snapshot, capped by the 100-result search window.

        For deterministic chronological pagination across all accessible notes, use `GET /v2/notes`.'
      operationId: app_src_api_routes_external_v2_notes_views_search_notes
      parameters:
      - description: 'Maximum number of notes in this search page.

          Use smaller values for lower latency.

          Default is 20; valid range is 1 to 50.'
        in: query
        name: limit
        required: false
        schema:
          anyOf:
          - maximum: 50
            minimum: 1
            type: integer
          - type: 'null'
          default: 20
          description: 'Maximum number of notes in this search page.

            Use smaller values for lower latency.

            Default is 20; valid range is 1 to 50.'
          title: Limit
      - description: 'Number of matching notes to skip before returning results.

          This value is zero-based.'
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: 'Number of matching notes to skip before returning results.

            This value is zero-based.'
          minimum: 0
          title: Offset
          type: integer
      - description: 'Opaque search snapshot identifier returned by a previous search page.

          Required when requesting later pages with `offset > 0`.'
        in: query
        name: snapshot_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 'Opaque search snapshot identifier returned by a previous search page.

            Required when requesting later pages with `offset > 0`.'
          title: Snapshot Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteSearchRequestSchema'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteSearchResponseSchema'
          description: OK
      summary: Search Notes
      tags:
      - external-v2
      x-codeSamples:
      - label: cURL
        lang: bash
        source: "curl \"https://api.mem.ai/v2/notes/search?limit=20&offset=0\" \\\n     --header \"Content-Type: application/json\" \\\n     --header \"Authorization: Bearer $MEM_API_KEY\" \\\n     --data '{\n         \"query\": \"sales\"\n     }'"
