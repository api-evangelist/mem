          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optional inclusive lower bound for note creation time (ISO 8601).

            The timestamp must include a timezone offset such as `Z` or `+01:00`.'
          examples:
          - '2025-04-01T14:30:45Z'
          - '2023-12-15T09:45:30+01:00'
          title: Filter By Created After
        filter_by_created_before:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optional inclusive upper bound for note creation time (ISO 8601).

            The timestamp must include a timezone offset such as `Z` or `+01:00`.'
          examples:
          - '2025-04-30T23:59:59Z'
          - '2023-12-31T18:00:00+01:00'
          title: Filter By Created Before
        filter_by_updated_after:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optional inclusive lower bound for note update time (ISO 8601).

            The timestamp must include a timezone offset such as `Z` or `+01:00`.'
          examples:
          - '2025-04-01T14:30:45Z'
          - '2023-12-15T09:45:30+01:00'
          title: Filter By Updated After
        filter_by_updated_before:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optional inclusive upper bound for note update time (ISO 8601).

            The timestamp must include a timezone offset such as `Z` or `+01:00`.'
          examples:
          - '2025-04-30T23:59:59Z'
          - '2023-12-31T18:00:00+01:00'
          title: Filter By Updated Before
        query:
          description: 'Required text query for relevance matching.

            The query must contain at least one non-whitespace character.

            This endpoint does not provide exhaustive chronological pagination; for that, use

            `GET /v2/notes`.'
          minLength: 1
