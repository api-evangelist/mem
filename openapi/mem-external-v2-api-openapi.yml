            - Share Q2 priorities document'
          maxLength: 200000
          title: Content
          type: string
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optional creation timestamp (ISO 8601).

            If provided, it must include a timezone offset and cannot be in the future.

            If omitted, Mem uses `updated_at` when provided; otherwise current server time.'
          examples:
          - '2025-04-01T14:30:45Z'
          - '2023-12-15T09:45:30+01:00'
          title: Created At
        id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 'Optional UUID for the note.

            If omitted, Mem generates a new UUID.'
          title: Id
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Optional "last updated" timestamp for this write (ISO 8601).

            If provided, it must include a timezone offset and cannot be in the future.

            If omitted, Mem uses the current server time for the initial content write.'
          examples:
          - '2025-04-02T09:15:22Z'
          - '2023-12-15T09:45:30+01:00'
          title: Updated At
      required:
      - content
