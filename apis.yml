aid: mem
name: Mem
description: >-
  Mem is an AI-native note-taking and knowledge workspace that captures notes,
  meetings, and ideas and keeps them instantly searchable and discoverable. It
  pairs a Workspace (notes, collections, projects, calendar, meeting
  transcription) with an Agent that tracks priorities and surfaces timely
  reminders. Mem exposes a REST API (the Mem Public Client API at
  https://api.mem.ai) for creating, reading, searching, and organizing notes and
  collections, plus semantic search, attachments, audio recordings, calendar,
  sessions, and tasks. It also ships an official hosted Model Context Protocol
  (MCP) server so AI tools like Claude, ChatGPT, and CLI agents can work with a
  user's Mem knowledge natively over OAuth. Mem is backed by a16z.
