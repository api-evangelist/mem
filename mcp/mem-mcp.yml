description: >-
  Mem ships an official hosted, remote MCP server that gives AI tools secure
  OAuth-authenticated access to a user's Mem notes and collections. The docs
  state it exposes 23 tools for reading, creating, searching, and organizing
  notes and collections, backed by Mem's semantic search.
